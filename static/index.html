<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hangman</title>
  <meta name="description" content="Play Hangman against a Flask server.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Hangman</h1>
      <div class="controls">
        <fieldset class="difficulty" id="difficulty">
          <legend class="visually-hidden">Difficulty</legend>
          <label><input type="radio" name="difficulty" value="easy"><span>Easy</span></label>
          <label><input type="radio" name="difficulty" value="medium" checked><span>Medium</span></label>
          <label><input type="radio" name="difficulty" value="hard"><span>Hard</span></label>
        </fieldset>
        <button type="button" id="new-game" class="primary">New Game</button>
      </div>
    </header>

    <section class="board" id="board">
      <svg id="hangman" class="hangman" viewBox="0 0 200 230" role="img" aria-labelledby="hangman-title">
        <title id="hangman-title">Hangman drawing</title>
        <g class="gallows">
          <line x1="20" y1="215" x2="180" y2="215"></line>
          <line x1="60" y1="215" x2="60" y2="20"></line>
          <line x1="60" y1="20" x2="140" y2="20"></line>
          <line x1="140" y1="20" x2="140" y2="45"></line>
        </g>
        <g class="figure">
          <circle class="part" data-part="1" cx="140" cy="65" r="20"></circle>
          <line class="part" data-part="2" x1="140" y1="85" x2="140" y2="145"></line>
          <line class="part" data-part="3" x1="140" y1="100" x2="112" y2="128"></line>
          <line class="part" data-part="4" x1="140" y1="100" x2="168" y2="128"></line>
          <line class="part" data-part="5" x1="140" y1="145" x2="115" y2="185"></line>
          <line class="part" data-part="6" x1="140" y1="145" x2="165" y2="185"></line>
        </g>
      </svg>

      <div class="info">
        <p class="pattern" id="pattern" aria-label="Word"></p>
        <dl class="stats">
          <div><dt>Lives left</dt><dd id="remaining">&ndash;</dd></div>
          <div><dt>Guessed</dt><dd id="guessed">&ndash;</dd></div>
          <div><dt>Wrong</dt><dd id="wrong">&ndash;</dd></div>
        </dl>
      </div>
    </section>

    <p class="message" id="message" role="status" aria-live="polite"></p>

    <div class="keyboard" id="keyboard" role="group" aria-label="Letters"></div>

    <p class="hint">Click a letter or type it on your keyboard. Press Enter for a new game when a game ends.</p>

    <noscript>
      <p class="message message--error">This game needs JavaScript. Please turn it on and reload the page.</p>
    </noscript>
  </main>
</body>
</html>
